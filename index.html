<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playlist Bladwijzer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bladwijzer">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #121212; --card: #1e1e1e; --card2: #2a2a2a; --text: #f2f2f2;
    --muted: #a7a7a7; --accent: #1ed760; --accent-text: #0b0b0b; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 8px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer;
    background: var(--card2); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.small { padding: 6px 12px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: default; }
  .link { background: none; color: var(--muted); padding: 6px 0; }
  .card { background: var(--card); border-radius: 12px; padding: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--muted); font-size: 14px; }
  .cover { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--card2); flex: none; }
  img[src=""] { visibility: hidden; }
  .cover.big { width: 96px; height: 96px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list .card { cursor: pointer; }
  .bookmark { color: var(--accent); font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  input[type=search] { width: 100%; font: inherit; padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--card2); background: var(--card); color: var(--text); }
  .track { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
  .track:hover { background: var(--card); }
  .track.saved { background: #1ed76022; }
  .num { width: 32px; text-align: right; color: var(--muted); font-size: 14px; flex: none; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 16px; border-radius: 10px; max-width: 90vw; display: none; z-index: 10; }
  .center { text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<main id="app"><p class="center muted">Laden…</p></main>
<div id="toast"></div>

<script>
// ===== Instellingen =====
const CLIENT_ID = '9424577e9fef406fb126cfcfeaa47105';
const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = [
  'playlist-read-private', 'playlist-read-collaborative',
  'user-read-currently-playing', 'user-read-playback-state', 'user-modify-playback-state'
].join(' ');
const API = 'https://api.spotify.com/v1';

// ===== Opslag (later uit te breiden met synchronisatie) =====
// Bladwijzers en sync-gegevens worden per Spotify-account bewaard, zodat meerdere mensen hetzelfde toestel kunnen gebruiken.
const PER_USER = ['bladwijzers', 'pl_dates', 'pl_cache', 'gh_token', 'gist_id', 'gist_etag', 'gist_last', 'last_sync', 'sync_error'];
const raw = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, v) { try { localStorage.setItem(key, v); } catch {} },
  del(key) { try { localStorage.removeItem(key); } catch {} }
};
const fullKey = key => PER_USER.includes(key) ? key + ':' + (raw.get('spotify_user') || '_') : key;
const store = {
  get(key, fallback) { try { const v = raw.get(fullKey(key)); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { raw.set(fullKey(key), JSON.stringify(value)); },
  del(key) { raw.del(fullKey(key)); }
};
function setUser(id) {
  raw.set('spotify_user', id);
  // Gegevens van vóór deze versie (zonder account erbij) gaan naar het eerste account dat zich aanmeldt.
  for (const k of PER_USER) {
    const old = raw.get(k);
    if (old !== null) { if (raw.get(k + ':' + id) === null) raw.set(k + ':' + id, old); raw.del(k); }
  }
}
// Een gewiste bladwijzer blijft als { deleted: true } bewaard, zodat het wissen ook naar je andere toestel gaat.
const bookmarks = {
  raw() { return store.get('bladwijzers', {}); },
  all() { return Object.fromEntries(Object.entries(this.raw()).filter(([, b]) => !b.deleted)); },
  get(playlistId) { return this.all()[playlistId]; },
  put(playlistId, value) { const raw = this.raw(); raw[playlistId] = { ...value, savedAt: new Date().toISOString() }; store.set('bladwijzers', raw); sync.soon(); },
  save(playlistId, data) { this.put(playlistId, data); },
  remove(playlistId) { this.put(playlistId, { deleted: true }); }
};

// ===== Synchronisatie via een geheime GitHub-gist =====
const GIST_FILE = 'bladwijzers.json';
const sync = {
  busy: null, timer: null,
  token() { return store.get('gh_token', ''); },
  async gh(path, options = {}) {
    const res = await fetch('https://api.github.com' + path, {
      ...options, cache: 'no-store',
      headers: { Authorization: 'Bearer ' + this.token(), Accept: 'application/vnd.github+json',
        ...(options.body ? { 'Content-Type': 'application/json' } : {}) }
    });
    if (res.status === 401) throw new Error('GitHub-token ongeldig of verlopen');
    if (!res.ok) throw new Error('GitHub gaf fout ' + res.status);
    return res.json();
  },
  async gistId() {
    let id = store.get('gist_id', null);
    if (id) return id;
    for (let page = 1; page <= 10 && !id; page++) {
      const list = await this.gh('/gists?per_page=100&page=' + page);
      id = list.find(g => g.files && g.files[GIST_FILE])?.id;
      if (list.length < 100) break;
    }
    if (!id) {
      const g = await this.gh('/gists', { method: 'POST', body: JSON.stringify({
        description: 'Playlist Bladwijzer: gesynchroniseerde bladwijzers', public: false,
        files: { [GIST_FILE]: { content: '{}' } } }) });
      id = g.id;
    }
    store.set('gist_id', id);
    return id;
  },
  merge(a, b) {
    const out = { ...a };
    for (const [k, v] of Object.entries(b)) if (!out[k] || (v.savedAt || '') > (out[k].savedAt || '')) out[k] = v;
    return out;
  },
  // Haalt de bladwijzers van GitHub op, voegt ze samen met de lokale (nieuwste wint) en schrijft het resultaat terug.
  // Geeft true terug als er lokaal iets veranderde.
  run() {
    if (!raw.get('spotify_user') || !this.token()) return Promise.resolve(false);
    if (this.busy) return this.busy.then(() => this.run());
    this.busy = (async () => {
      const id = await this.gistId();
      // Vraag de gist enkel volledig op als hij veranderd is (ETag), dat spaart verkeer bij het automatisch controleren.
      const res = await fetch('https://api.github.com/gists/' + id, { cache: 'no-store', headers: {
        Authorization: 'Bearer ' + this.token(), Accept: 'application/vnd.github+json',
        ...(store.get('gist_etag', null) ? { 'If-None-Match': store.get('gist_etag') } : {}) } });
      if (res.status === 401) throw new Error('GitHub-token ongeldig of verlopen');
      let remote = {};
      if (res.status === 304) {
        remote = store.get('gist_last', {});
      } else {
        if (!res.ok) throw new Error('GitHub gaf fout ' + res.status);
        const g = await res.json();
        const f = g.files?.[GIST_FILE];
        if (f) {
          try { remote = JSON.parse((f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content) || '{}'); } catch {}
        }
        store.set('gist_etag', res.headers.get('ETag'));
        store.set('gist_last', remote);
      }
      const local = bookmarks.raw();
      const merged = this.merge(local, remote);
      store.set('bladwijzers', merged);
      if (JSON.stringify(merged) !== JSON.stringify(remote)) {
        await this.gh('/gists/' + id, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(merged, null, 1) } } }) });
        store.set('gist_last', merged); store.del('gist_etag');
      }
      store.set('last_sync', new Date().toISOString());
      store.del('sync_error');
      return JSON.stringify(merged) !== JSON.stringify(local);
    })().catch(e => { store.set('sync_error', e.message); return false; })
      .finally(() => { this.busy = null; });
    return this.busy;
  },
  soon() { clearTimeout(this.timer); this.timer = setTimeout(() => this.run().then(updateSyncStatus), 300); },
  async connect(token) {
    store.set('gh_token', token.trim()); store.del('gist_id'); store.del('gist_etag'); store.del('gist_last');
    await this.run();
    const err = store.get('sync_error', null);
    if (err) { store.del('gh_token'); throw new Error(err); }
  },
  disconnect() { store.del('gh_token'); store.del('gist_id'); store.del('gist_etag'); store.del('gist_last'); store.del('last_sync'); store.del('sync_error'); }
};
async function syncAndRefresh() {
  const changed = await sync.run();
  updateSyncStatus();
  if (changed && viewRefresh) { try { viewRefresh(); } catch {} }
}
// Elk scherm zet hier een functie die enkel de bladwijzers opnieuw tekent (zonder je zoekterm of scrollpositie te verliezen).
let viewRefresh = null;
// Zolang de app open staat, controleer elke 15 seconden of er op een ander toestel iets veranderde.
setInterval(() => { if (!document.hidden && sync.token()) syncAndRefresh(); }, 15000);

// ===== Inloggen met Spotify (PKCE, geen geheim nodig) =====
function randomString(len) {
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(bytes, b => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[b % 62]).join('');
}
async function sha256base64url(text) {
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function login() {
  const verifier = randomString(64);
  store.set('pkce_verifier', verifier);
  const params = new URLSearchParams({
    client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI, scope: SCOPES,
    code_challenge_method: 'S256', code_challenge: await sha256base64url(verifier)
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params;
}
async function tokenRequest(body) {
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CLIENT_ID, ...body })
  });
  if (!res.ok) { const e = new Error('Inloggen mislukt (' + res.status + ')'); e.status = res.status; throw e; }
  const t = await res.json();
  const old = store.get('token', {});
  store.set('token', {
    access: t.access_token, refresh: t.refresh_token || old.refresh,
    expires: Date.now() + (t.expires_in - 60) * 1000
  });
}
async function handleRedirect() {
  const params = new URLSearchParams(location.search);
  if (params.get('error')) { history.replaceState(null, '', REDIRECT_URI); toast('Inloggen geannuleerd'); return; }
  const code = params.get('code');
  if (!code) return;
  history.replaceState(null, '', REDIRECT_URI);
  await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: store.get('pkce_verifier', '') });
  store.del('pkce_verifier');
}
// Spotify geeft bij elke vernieuwing een nieuwe refresh-token en maakt de oude ongeldig.
// Daarom mag er maar één vernieuwing tegelijk lopen; anders faalt de tweede en word je uitgelogd.
let refreshing = null;
async function accessToken(force) {
  const t = store.get('token', null);
  if (!t) return null;
  if (!force && Date.now() < t.expires) return t.access;
  if (!refreshing) {
    refreshing = (async () => {
      try { await tokenRequest({ grant_type: 'refresh_token', refresh_token: t.refresh }); return 'ok'; }
      catch (e) {
        const now = store.get('token', null);
        if (now && now.refresh !== t.refresh) return 'ok';          // een ander venster vernieuwde al
        if (e.status === 400 || e.status === 401) { store.del('token'); return 'expired'; } // echt ongeldig
        return 'offline';                                            // netwerkprobleem: blijf aangemeld
      }
    })().finally(() => { refreshing = null; });
  }
  const result = await refreshing;
  if (result === 'ok') return store.get('token').access;
  if (result === 'offline') return t.access;
  return null;
}
function logout() { store.del('token'); raw.del('spotify_user'); me = null; playlists = null; render(); }

// ===== Spotify API =====
// Als Spotify de app afremt (fout 429), vragen we niets meer tot de wachttijd voorbij is. Elke extra vraag
// tijdens een blokkade kan die blokkade verlengen. De wachttijd wordt onthouden, ook als je de app sluit.
let rateLimitedUntil = Number(raw.get('rl_until')) || 0;
function rateLimitError() {
  const t = new Date(rateLimitedUntil).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
  const e = new Error(`Spotify heeft de app even afgeremd. Ze probeert het opnieuw om ${t}.`);
  e.status = 429; return e;
}
async function api(path, options = {}, retried) {
  if (Date.now() < rateLimitedUntil) throw rateLimitError();
  const token = await accessToken();
  if (!token) { render(); throw new Error('Niet ingelogd'); }
  const res = await fetch(path.startsWith('http') ? path : API + path, {
    ...options, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (res.status === 204) return null;
  if (res.status === 401) {
    // Eerst de toegang vernieuwen en één keer opnieuw proberen, pas daarna opnieuw laten inloggen.
    if (!retried && await accessToken(true)) return api(path, options, true);
    render(); throw new Error('Opnieuw inloggen nodig');
  }
  if (res.status === 429) {
    // Te veel vragen in korte tijd: Spotify zegt hoeveel seconden we moeten wachten.
    // Kan de browser de wachttijd niet lezen, dan wachten we telkens langer: 1, 2, 4 … tot 60 minuten.
    const header = Number(res.headers.get('Retry-After'));
    const backoff = Math.min((Number(raw.get('rl_backoff')) || 30) * 2, 3600);
    const wait = header > 0 ? header : backoff;
    if (!(header > 0)) raw.set('rl_backoff', String(backoff));
    rateLimitedUntil = Date.now() + wait * 1000;
    raw.set('rl_until', String(rateLimitedUntil));
    if (!retried && header > 0 && header <= 3) { await new Promise(r => setTimeout(r, header * 1000)); return api(path, options, true); }
    throw rateLimitError();
  }
  raw.del('rl_backoff');
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) { const e = new Error(data?.error?.message || ('Fout ' + res.status)); e.status = res.status; e.reason = data?.error?.reason; throw e; }
  return data;
}
async function allPages(path) {
  let url = path, items = [];
  while (url) { const page = await api(url); items.push(...page.items); url = page.next; }
  return items;
}
let me = null, playlists = null;
// De lijst met playlists wordt ook lokaal bewaard, zodat de app iets kan tonen als Spotify even niet antwoordt.
let playlistsFromCache = false;
async function loadPlaylists(force) {
  if (playlists && !force && !playlistsFromCache) return playlists;
  try {
    try { await ensureUser(); } catch (e) { if (!raw.get('spotify_user')) throw e; }
    playlists = (await allPages('/me/playlists?limit=50')).filter(Boolean);
    playlistsFromCache = false;
    store.set('pl_cache', playlists.map(p => ({ id: p.id, name: p.name, uri: p.uri, snapshot_id: p.snapshot_id,
      owner: { id: p.owner?.id }, collaborative: p.collaborative,
      images: p.images?.length ? [p.images.at(-1), p.images[0]].filter(Boolean).map(i => ({ url: i.url })) : [],
      items: { total: trackCount(p) } })));
  } catch (e) {
    const cached = store.get('pl_cache', null);
    if (!cached) throw e;
    playlists = cached; playlistsFromCache = true;
    if (e.status === 429) toast(e.message);
  }
  return playlists;
}
// Spotify geeft enkel nummers terug van playlists die je zelf maakte of waaraan je meewerkt.
function canListTracks(p) { return p.owner?.id === (me?.id || raw.get('spotify_user')) || p.collaborative; }
function trackCount(p) { return (p.items || p.tracks)?.total ?? 0; }
const trackCache = {};
async function loadTracks(playlistId) {
  const snap = playlists?.find(p => p.id === playlistId)?.snapshot_id;
  const c = trackCache[playlistId];
  if (c && c.snap === snap) return c.tracks;
  const rows = await allPages(`/playlists/${playlistId}/items?limit=50`);
  const tracks = rows.map(r => r.item || r.track).filter(t => t && t.uri);
  trackCache[playlistId] = { snap, tracks };
  return tracks;
}
// Spotify bewaart geen aanmaakdatum van playlists. Voor eigen playlists gebruiken we de datum van het
// eerst toegevoegde nummer; dat resultaat wordt bewaard en enkel opnieuw berekend als de playlist wijzigt.
function playlistDate(p) {
  const d = store.get('pl_dates', {})[p.id];
  return d && d.snap === p.snapshot_id ? d.date : undefined;  // null = bekeken, geen datum
}
let datesRunning = false;
async function loadPlaylistDates(lists, onUpdate) {
  if (datesRunning) return;
  datesRunning = true;
  try {
    // Rustig, één playlist tegelijk en enkel de eerste 50 nummers, zodat we Spotify niet overbelasten.
    const todo = lists.filter(p => canListTracks(p) && playlistDate(p) === undefined);
    for (const p of todo) {
      if (Date.now() < rateLimitedUntil || document.hidden) break;
      let first = null;
      try {
        const page = await api(`/playlists/${p.id}/items?limit=50&fields=items(added_at)`, {}, true);
        for (const r of page.items || []) if (r.added_at && r.added_at > '1971' && (!first || r.added_at < first)) first = r.added_at;
      } catch (e) { if (e.status === 429) break; }
      const all = store.get('pl_dates', {});
      all[p.id] = { snap: p.snapshot_id, date: first };
      store.set('pl_dates', all);
      onUpdate?.();
      await new Promise(r => setTimeout(r, 500));
    }
  } finally { datesRunning = false; }
}
function fmtDay(iso) { return new Date(iso).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' }); }

function simplify(track, position) {
  return {
    uri: track.uri, name: track.name,
    artists: (track.artists || []).map(a => a.name).join(', '),
    image: track.album?.images?.at(-1)?.url || track.album?.images?.[0]?.url || '',
    position: position ?? null
  };
}

// ===== Hervatten =====
// Sommige toestellen laten zich niet op afstand bedienen ("restricted"). Daarom kiezen we zelf een toestel
// dat wél bediend kan worden, en als dat er niet is, bieden we aan om de playlist in Spotify te openen.
async function resume(playlist) {
  const b = bookmarks.get(playlist.id);
  const body = JSON.stringify(b ? { context_uri: playlist.uri, offset: { uri: b.uri } } : { context_uri: playlist.uri });
  let devices = [];
  try { devices = (await api('/me/player/devices'))?.devices || []; } catch {}
  const usable = devices.filter(d => !d.is_restricted)
    .sort((x, y) => (y.is_active - x.is_active) || ((y.type === 'Computer' || y.type === 'Smartphone') - (x.type === 'Computer' || x.type === 'Smartphone')));
  for (const d of usable) {
    try {
      await api('/me/player/play?device_id=' + encodeURIComponent(d.id), { method: 'PUT', body });
      toast((b ? `Speelt verder vanaf „${b.name}”` : 'Playlist gestart') + (d.is_active ? '' : ` op ${d.name}`));
      return;
    } catch (e) { if (e.status !== 403 && e.status !== 404) { toast('Hervatten mislukt: ' + e.message); return; } }
  }
  showResumeHelp(playlist, b, devices);
}

function showResumeHelp(playlist, b, devices) {
  const restricted = devices.filter(d => d.is_restricted).map(d => d.name);
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px';
  el.innerHTML = `<div class="card" style="max-width:480px;width:100%;padding:20px;margin-bottom:env(safe-area-inset-bottom)">
      <h1 style="font-size:19px">Spotify laat dit toestel niet bedienen</h1>
      <p class="muted">${restricted.length ? 'Spotify blokkeert bediening op afstand voor ' + esc(restricted.join(', ')) + '. '
        : 'Spotify is momenteel op geen enkel toestel actief. '}
        Open Spotify, start daar eender welk nummer en kom terug om opnieuw te proberen.
        ${b ? `Of open de playlist en tik zelf op ${b.position ? 'nummer <b>' + b.position + '</b>, ' : ''}<b>${esc(b.name)}</b>.` : ''}</p>
      <div class="actions">
        <a class="primary" href="https://open.spotify.com/playlist/${esc(playlist.id)}" target="_blank" rel="noopener"
          style="text-decoration:none;border-radius:999px;padding:10px 16px;background:var(--accent);color:var(--accent-text);font-weight:600">Open in Spotify</a>
        <button id="retry">Opnieuw proberen</button>
        <button class="link" id="close">Sluiten</button>
      </div></div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.onclick = e => { if (e.target === el) close(); };
  el.querySelector('#close').onclick = close;
  el.querySelector('#retry').onclick = () => { close(); resume(playlist); };
}

// ===== Weergave =====
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.display = 'none', 3500);
}
function fmtDate(iso) {
  return new Date(iso).toLocaleString('nl-BE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function bookmarkLine(b) {
  if (!b) return '<span class="muted">Nog geen bladwijzer</span>';
  return `<span class="bookmark">▶ ${b.position ? '#' + b.position + ' · ' : ''}${esc(b.name)}</span> <span class="muted">· ${esc(b.artists)}</span>`;
}

// Haalt het Spotify-account op en onthoudt het. Geeft false terug als het account (nog) niet is toegelaten.
async function ensureUser() {
  if (me && raw.get('spotify_user') === me.id) return true;
  try {
    me = await api('/me');
    if (raw.get('spotify_user') !== me.id) { playlists = null; setUser(me.id); }
    return true;
  } catch (e) {
    if (e.status === 403) return false;
    throw e;
  }
}

async function render() {
  const token = await accessToken();
  if (token && !(await ensureUser().catch(() => true))) {
    app.innerHTML = `<div class="center">
      <h1>Nog geen toegang</h1>
      <p class="muted">Je Spotify-account is nog niet toegelaten tot deze app.<br>
        Vraag degene die de app met je deelde om je toe te voegen. Geef daarvoor je naam en het e-mailadres van je Spotify-account door.</p>
      <button id="logout2">Ander account gebruiken</button></div>`;
    document.getElementById('logout2').onclick = logout;
    return;
  }
  if (!token) {
    app.innerHTML = `<div class="center">
      <h1>Playlist Bladwijzer</h1>
      <p class="muted">Onthoud per playlist waar je gebleven was.</p>
      <button class="primary" id="login">Inloggen met Spotify</button></div>`;
    document.getElementById('login').onclick = login;
    return;
  }
  const route = location.hash.slice(1);
  viewRefresh = null;
  if (route.startsWith('playlist/')) return renderPlaylist(route.slice(9));
  if (route === 'instellingen') return renderSettings();
  return renderHome();
}

async function renderHome() {
  app.innerHTML = `<header><h1>Playlist Bladwijzer</h1><button class="small" id="settings" aria-label="Instellingen">⚙︎ Instellingen</button></header>
    <div id="syncline"></div>
    <h2>Nu aan het spelen</h2><div id="now" class="card muted">Laden…</div>
    <h2>Je playlists</h2><input type="search" id="filter" placeholder="Zoek een playlist">
    <div id="lists" class="list" style="margin-top:8px"><p class="muted">Laden…</p></div>`;
  document.getElementById('settings').onclick = () => location.hash = 'instellingen';
  updateSyncStatus();
  renderNowPlaying();
  try {
    const lists = await loadPlaylists();
    const draw = () => {
      const q = document.getElementById('filter').value.toLowerCase();
      const all = bookmarks.all();
      const shown = lists.filter(p => p.name.toLowerCase().includes(q))
        .sort((a, b) => (all[b.id]?.savedAt || '').localeCompare(all[a.id]?.savedAt || ''));
      document.getElementById('lists').innerHTML = shown.map(p => `
        <div class="card row" data-id="${p.id}">
          <img class="cover" src="${esc(p.images?.at(-1)?.url || p.images?.[0]?.url || '')}" alt="">
          <div class="grow"><div class="ellipsis"><b>${esc(p.name)}</b></div>
            <div class="ellipsis">${bookmarkLine(all[p.id])}</div>
            ${playlistDate(p) ? `<div class="muted ellipsis">Aangemaakt ${fmtDay(playlistDate(p))}</div>` : ''}</div>
        </div>`).join('') || '<p class="muted">Geen playlists gevonden.</p>';
      document.querySelectorAll('#lists .card').forEach(el => el.onclick = () => location.hash = 'playlist/' + el.dataset.id);
    };
    document.getElementById('filter').oninput = draw;
    draw();
    viewRefresh = draw;
    let t; setTimeout(() => loadPlaylistDates(lists, () => { clearTimeout(t); t = setTimeout(() => { if (viewRefresh === draw) draw(); }, 300); }), 2000);
  } catch (e) { document.getElementById('lists').innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

async function renderNowPlaying() {
  const el = document.getElementById('now');
  try {
    const now = await api('/me/player/currently-playing');
    if (!now || !now.item) { el.textContent = 'Er speelt momenteel niets op Spotify.'; return; }
    const t = now.item;
    const ctx = now.context?.type === 'playlist' ? now.context.uri.split(':').pop() : null;
    const lists = await loadPlaylists();
    const p = ctx && lists.find(x => x.id === ctx);
    el.classList.remove('muted');
    el.innerHTML = `<div class="row">
        <img class="cover" src="${esc(simplify(t).image)}" alt="">
        <div class="grow"><div class="ellipsis"><b>${esc(t.name)}</b></div>
          <div class="muted ellipsis">${esc(simplify(t).artists)}</div>
          <div class="muted ellipsis">${p ? 'Uit playlist: ' + esc(p.name) : 'Niet vanuit een van je playlists'}</div></div></div>
      ${p ? `<div class="actions"><button class="primary" id="savenow">Bewaar als bladwijzer</button></div>` : ''}`;
    if (p) document.getElementById('savenow').onclick = async () => {
      let position = null;
      if (canListTracks(p)) { try { position = (await loadTracks(p.id)).findIndex(x => x.uri === t.uri) + 1 || null; } catch {} }
      bookmarks.save(p.id, simplify(t, position));
      toast(`Bewaard voor „${p.name}”`);
      renderHome();
    };
  } catch (e) { el.textContent = 'Kon niet ophalen wat er speelt: ' + e.message; }
}

async function renderPlaylist(id) {
  app.innerHTML = '<p class="center muted">Laden…</p>';
  const lists = await loadPlaylists();
  const p = lists.find(x => x.id === id);
  if (!p) { location.hash = ''; return; }
  const b = bookmarks.get(id);
  app.innerHTML = `<header><button class="link" id="back">‹ Terug</button></header>
    <div class="row"><img class="cover big" src="${esc(p.images?.[0]?.url || '')}" alt="">
      <div class="grow"><h1>${esc(p.name)}</h1><div class="muted">${trackCount(p)} nummers${playlistDate(p) ? ' · aangemaakt ' + fmtDay(playlistDate(p)) : ''}</div></div></div>
    <div class="card" style="margin-top:16px" id="bm"></div>
    <h2>Kies het laatste nummer zelf</h2>
    <input type="search" id="q" placeholder="${canListTracks(p) ? 'Filter de nummers' : 'Zoek een nummer op titel of artiest'}">
    <div id="tracks" style="margin-top:8px"></div>`;
  document.getElementById('back').onclick = () => location.hash = '';
  const drawBookmark = () => {
    const b = bookmarks.get(id);
    document.getElementById('bm').innerHTML = `
      <div class="muted">Laatst gebleven bij</div>
      <div>${bookmarkLine(b)}</div>
      ${b ? `<div class="muted">Bewaard op ${fmtDate(b.savedAt)}</div>` : ''}
      <div class="actions">
        <button class="primary" id="resume">${b ? 'Hervat vanaf dit nummer' : 'Speel playlist af'}</button>
        ${b ? '<button id="clear">Wis bladwijzer</button>' : ''}
      </div>`;
    document.getElementById('resume').onclick = () => resume(p);
    if (b) document.getElementById('clear').onclick = () => { bookmarks.remove(id); drawBookmark(); redrawTracks?.(); };
  };
  drawBookmark();
  let redrawTracks = null;
  viewRefresh = () => { drawBookmark(); redrawTracks?.(); };

  const tracksEl = document.getElementById('tracks');
  const q = document.getElementById('q');
  const pick = (track, position) => {
    bookmarks.save(id, simplify(track, position));
    toast('Bladwijzer bewaard');
    renderPlaylist(id); window.scrollTo(0, 0);
  };
  const drawTracks = (tracks, numbered) => {
    redrawTracks = () => drawTracks(tracks, numbered);
    const saved = bookmarks.get(id)?.uri;
    tracksEl.innerHTML = tracks.map(({ t, n }) => `
      <div class="track ${t.uri === saved ? 'saved' : ''}" data-uri="${esc(t.uri)}">
        ${numbered ? `<span class="num">${n}</span>` : ''}
        <img class="cover" style="width:40px;height:40px" src="${esc(simplify(t).image)}" alt="">
        <div class="grow"><div class="ellipsis">${esc(t.name)}</div><div class="muted ellipsis">${esc(simplify(t).artists)}</div></div>
      </div>`).join('') || '<p class="muted">Geen nummers gevonden.</p>';
    tracksEl.querySelectorAll('.track').forEach(el => el.onclick = () => {
      const hit = tracks.find(x => x.t.uri === el.dataset.uri);
      pick(hit.t, numbered ? hit.n : null);
    });
  };

  if (canListTracks(p)) {
    tracksEl.innerHTML = '<p class="muted">Nummers laden…</p>';
    try {
      const all = (await loadTracks(id)).map((t, i) => ({ t, n: i + 1 }));
      drawTracks(all, true);
      q.oninput = () => { const s = q.value.toLowerCase();
        drawTracks(all.filter(({ t }) => (t.name + ' ' + simplify(t).artists).toLowerCase().includes(s)), true); };
    } catch (e) { tracksEl.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
  } else {
    tracksEl.innerHTML = `<p class="muted">Spotify toont de nummers van playlists van anderen niet aan zelfgemaakte apps.
      Zoek het nummer hieronder, of bewaar het vanaf het startscherm terwijl het speelt.</p>`;
    let timer;
    q.oninput = () => { clearTimeout(timer); timer = setTimeout(async () => {
      if (q.value.trim().length < 2) return;
      try {
        const res = await api('/search?type=track&limit=10&q=' + encodeURIComponent(q.value));
        drawTracks(res.tracks.items.map(t => ({ t })), false);
      } catch (e) { tracksEl.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
    }, 400); };
  }
}

function renderSettings() {
  app.innerHTML = `<header><button class="link" id="back">‹ Terug</button></header>
    <h1>Instellingen</h1>
    <h2>Spotify</h2>
    <div class="card"><div class="row" id="account"><div class="grow muted">Account laden…</div></div>
      <div class="actions"><button class="small" id="logout">Uitloggen</button>
        <button class="small" id="conntest">Test verbinding</button></div>
      <div id="conntestresult" class="muted" style="margin-top:8px"></div></div>
    <h2>Synchronisatie tussen Mac en iPhone</h2>
    <div id="sync" class="card"></div>`;
  document.getElementById('back').onclick = () => location.hash = '';
  document.getElementById('logout').onclick = () => { location.hash = ''; logout(); };
  document.getElementById('conntest').onclick = testConnection;
  updateSyncStatus();
  renderAccount();
  if (Date.now() < rateLimitedUntil) document.getElementById('conntestresult').textContent = rateLimitError().message;
}

// Doet precies één vraag aan Spotify, ook tijdens een wachttijd, en toont het eerlijke antwoord.
async function testConnection() {
  const out = document.getElementById('conntestresult');
  out.style.color = '';
  out.textContent = 'Bezig met testen…';
  const token = await accessToken();
  if (!token) { out.textContent = 'Niet ingelogd bij Spotify.'; return; }
  let res;
  try { res = await fetch(API + '/me', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' }); }
  catch (e) { out.textContent = 'Geen verbinding met Spotify (netwerkfout): ' + e.message; return; }
  let msg = '';
  try { msg = (await res.json())?.error?.message || ''; } catch {}
  if (res.ok) {
    rateLimitedUntil = 0; raw.del('rl_until'); raw.del('rl_backoff');
    out.style.color = 'var(--accent)';
    out.textContent = `✓ Spotify antwoordt normaal (code ${res.status}). Er is geen blokkade meer; de wachttijd is gewist.`;
    playlistsFromCache = true;
    return;
  }
  out.style.color = 'var(--danger)';
  if (res.status === 429) {
    const ra = res.headers.get('Retry-After');
    out.textContent = `Spotify blokkeert de app nog (code 429${msg ? ': ' + msg : ''}). ` +
      (ra ? `Volgens Spotify nog ${ra >= 120 ? Math.ceil(ra / 60) + ' minuten' : ra + ' seconden'}.` : 'Spotify zegt niet hoe lang nog.');
  } else if (res.status === 403) {
    out.textContent = `Spotify weigert de toegang (code 403${msg ? ': ' + msg : ''}). Dit is geen blokkade door te veel vragen.`;
  } else {
    out.textContent = `Spotify gaf een andere fout (code ${res.status}${msg ? ': ' + msg : ''}).`;
  }
}

async function renderAccount() {
  const el = document.getElementById('account');
  try {
    await ensureUser();
    const pic = me.images?.at(-1)?.url || me.images?.[0]?.url || '';
    const name = me.display_name || me.id;
    el.innerHTML = `${pic ? `<img class="cover" style="border-radius:50%" src="${esc(pic)}" alt="">`
        : `<div class="cover row" style="border-radius:50%;justify-content:center;font-size:22px;font-weight:600">${esc(name.charAt(0).toUpperCase())}</div>`}
      <div class="grow"><div class="muted">Ingelogd als</div><div class="ellipsis"><b>${esc(name)}</b></div>
        <div class="muted ellipsis">Gebruikersnaam: ${esc(me.id)}</div></div>`;
  } catch (e) { el.innerHTML = `<div class="grow muted">Kon je account niet ophalen: ${esc(e.message)}</div>`; }
}

function updateSyncStatus() {
  const err = store.get('sync_error', null), last = store.get('last_sync', null);
  const statusText = err ? 'Synchroniseren mislukt: ' + esc(err)
    : last ? 'Gesynchroniseerd op ' + fmtDate(last) : 'Nog niet gesynchroniseerd';

  // Korte status op het startscherm
  const line = document.getElementById('syncline');
  if (line) {
    line.innerHTML = !sync.token()
      ? `<div class="card row" style="cursor:pointer"><div class="grow muted">Sync tussen Mac en iPhone staat uit.</div><span class="bookmark">Instellen ›</span></div>`
      : err ? `<div class="card" style="cursor:pointer;color:var(--danger)">${statusText} <span class="muted">· Bekijk ›</span></div>` : '';
    line.onclick = () => location.hash = 'instellingen';
  }

  // Volledig scherm in Instellingen
  const el = document.getElementById('sync');
  if (!el) return;
  if (!sync.token()) {
    el.innerHTML = `<div class="muted">Je bladwijzers worden bewaard in een geheime gist op je GitHub-account.
        Gebruik op je Mac en je iPhone hetzelfde token, dan zie je op beide toestellen dezelfde bladwijzers.</div>
      <ol class="muted" style="padding-left:20px">
        <li>Maak een token op <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--accent)">GitHub</a>.</li>
        <li>Zet onder <b>Account permissions</b> enkel <b>Gists</b> op <b>Read and write</b>.</li>
        <li>Kopieer het token en plak het hieronder.</li>
      </ol>
      <label class="muted" for="ghtoken">GitHub-token</label>
      <input type="password" id="ghtoken" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"
        style="display:block;width:100%;margin-top:6px;font:inherit;padding:10px 14px;border-radius:999px;border:1px solid var(--card2);background:var(--bg);color:var(--text)">
      <div class="actions"><button class="primary" id="ghconnect">Koppel</button></div>`;
    document.getElementById('ghconnect').onclick = async () => {
      const v = document.getElementById('ghtoken').value;
      if (!v.trim()) { toast('Plak eerst je token'); return; }
      const btn = document.getElementById('ghconnect'); btn.disabled = true; btn.textContent = 'Bezig…';
      try { await sync.connect(v); toast('Synchronisatie staat aan'); updateSyncStatus(); }
      catch (e) { toast('Koppelen mislukt: ' + e.message); btn.disabled = false; btn.textContent = 'Koppel'; }
    };
    return;
  }
  el.innerHTML = `<div style="${err ? 'color:var(--danger)' : ''}">${err ? statusText : '✓ Synchronisatie staat aan'}</div>
    ${err ? '' : `<div class="muted">${statusText}</div>`}
    <div class="actions"><button class="small" id="syncnow">Nu synchroniseren</button>
      <button class="small" id="syncoff">Ontkoppel</button></div>`;
  document.getElementById('syncnow').onclick = () => { toast('Bezig…'); syncAndRefresh().then(() => toast('Klaar')); };
  document.getElementById('syncoff').onclick = () => { sync.disconnect(); updateSyncStatus(); toast('Synchronisatie staat uit op dit toestel'); };
}

// Vraag de browser om de opgeslagen gegevens (aanmelding, token, bladwijzers) niet op te ruimen.
try { navigator.storage?.persist?.(); } catch {}

window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (!location.hash) render();
  syncAndRefresh();
});
handleRedirect().catch(e => toast(e.message)).finally(() => { render(); syncAndRefresh(); });
</script>
</body>
</html>
